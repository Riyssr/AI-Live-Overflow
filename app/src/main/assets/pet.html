<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; }
body {
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
  user-select: none;
}
.pet {
  width: 100%;
  height: 100%;
  transition: transform 0.3s ease;
}
.pet.poked { transform: scale(1.15); }
.pet.angry { animation: shake 0.4s ease; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px) rotate(-3deg); }
  50% { transform: translateX(8px) rotate(3deg); }
  75% { transform: translateX(-5px) rotate(-2deg); }
}
</style>

<script>
window.petEngine = {
  onGesture: function(type) {
    var pet = document.querySelector('.pet');
    if (type === 'tap') {
      pet.classList.add('poked');
      setTimeout(function(){ pet.classList.remove('poked'); }, 300);
    } else if (type === 'double_tap') {
      pet.classList.add('angry');
      setTimeout(function(){ pet.classList.remove('angry'); }, 400);
    }
  },
  setState: function(state) {
    if (state.bubble) {

  }
};
